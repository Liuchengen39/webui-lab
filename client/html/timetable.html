<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程規劃系統｜視覺化課表</title>
  <link rel="stylesheet" href="/css/timetable.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-mark">△M</div>
        <div class="logo-text">
          <strong>暨南大學</strong>
          <span>課程排課系統</span>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html"><span class="icon">▦</span><span class="label">綜合總覽</span></a>
        <a class="active" href="timetable.html"><span class="icon">▤</span><span class="label">課表</span></a>
        <a href="settings.html"><span class="icon">⚙</span><span class="label">系統設定</span></a>
      </nav>
    </aside>

    <div class="main">
      <header class="header">
        <div class="notice">♧</div>
        <div class="profile">
          <div class="avatar"></div>
          <div>
            <b>劉承恩</b>
            <small>大一</small>
          </div>
        </div>
      </header>

      <main class="content">
        <div class="top">
          <h1>視覺化課表</h1>
          <button class="btn" id="reloadBtn">重新整理</button>
        </div>

        <div class="card">
          <h3>2026 秋季學期</h3>
          <div class="tt-summary" id="ttSummary"></div>
          <div class="tt-scroll"><div class="timetable" id="timetable"></div></div>

          <div id="ttLegend" class="tt-legend"></div>
          <div id="unscheduled"></div>

          <div class="legend">
            ● 課程會依首頁「已新增」的課程同步更新　　⚠ 衝堂課程將以紅色警示樣式顯示
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/timetable.js"></script>
</body>
</html>
