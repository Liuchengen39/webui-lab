<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout-components.css">
    <link rel="stylesheet" href="css/accounting.css">
    <title>WebUI Lab - 記帳</title>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">WebUI Lab</h1>
                <p class="app-subtitle">時間 × 開銷管理</p>
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link" data-page="dashboard">
                            <span class="nav-icon">📊</span>
                            <span class="nav-text">綜合</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="timetable.html" class="nav-link" data-page="timetable">
                            <span class="nav-icon">📅</span>
                            <span class="nav-text">課表</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="accounting.html" class="nav-link active" data-page="accounting">
                            <span class="nav-icon">💰</span>
                            <span class="nav-text">記帳</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="settings.html" class="nav-link" data-page="settings">
                            <span class="nav-icon">⚙️</span>
                            <span class="nav-text">設定</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <p class="user-name">未登入</p>
                        <p class="user-status">請登入帳號</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <div class="header-left">
                    <h2 class="page-title">記帳</h2>
                </div>
                <div class="header-right">
                    <span class="current-date">2026年 09月 28日</span>
                    <span class="current-semester">115學年 第1學期</span>
                </div>
            </header>

            <section class="page-content">
                <section id="accounting" class="page-section active">
                    <h1 class="section-title">記帳</h1>

                    <div class="month-selector">
                        <button class="btn btn-prev" id="prevMonth">← 上月</button>
                        <span class="month-display" id="monthDisplay">2026年 09月</span>
                        <button class="btn btn-next" id="nextMonth">下月 →</button>
                    </div>

                    <div class="charts-container">
                        <div class="chart-wrapper">
                            <h3 class="chart-title">支出分類</h3>
                            <div class="doughnut-chart" id="expenseChart">
                                <div class="chart-center">
                                    <p class="chart-amount" id="totalExpenseAmount">NT$ 0</p>
                                    <p class="chart-label">總支出</p>
                                </div>
                                <svg class="doughnut-svg" viewBox="0 0 200 200" id="expenseDoughnut"></svg>
                            </div>
                        </div>

                        <div class="chart-wrapper">
                            <h3 class="chart-title">收入分類</h3>
                            <div class="doughnut-chart" id="incomeChart">
                                <div class="chart-center">
                                    <p class="chart-amount" id="totalIncomeAmount">NT$ 0</p>
                                    <p class="chart-label">總收入</p>
                                </div>
                                <svg class="doughnut-svg" viewBox="0 0 200 200" id="incomeDoughnut"></svg>
                            </div>
                        </div>
                    </div>

                    <div class="accounting-input-section">
                        <h3 class="section-subtitle">新增記帳</h3>
                        <form id="addRecordForm" class="add-record-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="recordType">收/支</label>
                                    <select id="recordType" name="recordType" required>
                                        <option value="">選擇類型</option>
                                        <option value="expense">支出</option>
                                        <option value="income">收入</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="recordCategory">類別</label>
                                    <select id="recordCategory" name="recordCategory" required>
                                        <option value="">選擇類別</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="recordAmount">金額</label>
                                    <input type="number" id="recordAmount" name="recordAmount" min="0" step="1" placeholder="0" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="recordDate">日期</label>
                                    <input type="date" id="recordDate" name="recordDate" required>
                                </div>
                                <div class="form-group">
                                    <label for="recordNote">備註</label>
                                    <input type="text" id="recordNote" name="recordNote" placeholder="輸入備註...">
                                </div>
                                <button type="submit" class="btn btn-primary">新增</button>
                            </div>
                        </form>
                    </div>

                    <div class="custom-keypad" id="customKeypad">
                        <div class="keypad-display">
                            <input type="text" class="keypad-input" id="keypadInput" readonly>
                        </div>
                        <div class="keypad-buttons">
                            <button class="keypad-btn" data-key="7">7</button>
                            <button class="keypad-btn" data-key="8">8</button>
                            <button class="keypad-btn" data-key="9">9</button>
                            <button class="keypad-btn keypad-clear" data-key="C">C</button>

                            <button class="keypad-btn" data-key="4">4</button>
                            <button class="keypad-btn" data-key="5">5</button>
                            <button class="keypad-btn" data-key="6">6</button>
                            <button class="keypad-btn keypad-backspace" data-key="⌫">⌫</button>

                            <button class="keypad-btn" data-key="1">1</button>
                            <button class="keypad-btn" data-key="2">2</button>
                            <button class="keypad-btn" data-key="3">3</button>
                            <button class="keypad-btn" data-key=".">.</button>

                            <button class="keypad-btn" data-key="0">0</button>
                            <button class="keypad-btn keypad-submit" data-key="✓">✓</button>
                        </div>
                    </div>

                    <div class="accounting-records-section">
                        <h3 class="section-subtitle">記帳明細</h3>
                        <div class="records-container" id="recordsContainer">
                            <div class="day-group">
                                <h4 class="day-header">2024年01月15日 (星期一)</h4>
                                <ul class="records-list">
                                    <li class="record-item">
                                        <div class="record-info">
                                            <p class="record-category">早餐</p>
                                            <p class="record-note">7-11 便當</p>
                                        </div>
                                        <div class="record-amount expense">-NT$ 70</div>
                                        <button class="record-action delete-btn" data-id="1">×</button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
