<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout-components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <title>WebUI Lab - 綜合</title>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">WebUI Lab</h1>
                <p class="app-subtitle">時間 × 開銷管理</p>
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link active" data-page="dashboard">
                            <span class="nav-icon">📊</span>
                            <span class="nav-text">綜合</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="timetable.html" class="nav-link" data-page="timetable">
                            <span class="nav-icon">📅</span>
                            <span class="nav-text">課表</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="accounting.html" class="nav-link" data-page="accounting">
                            <span class="nav-icon">💰</span>
                            <span class="nav-text">記帳</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="settings.html" class="nav-link" data-page="settings">
                            <span class="nav-icon">⚙️</span>
                            <span class="nav-text">設定</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <p class="user-name">未登入</p>
                        <p class="user-status">請登入帳號</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <div class="header-left">
                    <h2 class="page-title">綜合</h2>
                </div>
                <div class="header-right">
                    <span class="current-date">2026年 09月 28日</span>
                    <span class="current-semester">115學年 第1學期</span>
                </div>
            </header>

            <section class="page-content">
                <section id="dashboard" class="page-section active">
                    <h1 class="section-title">綜合總覽</h1>

                    <div class="dashboard-grid">

                        <!-- 下一堂課卡片 -->
                        <section class="card next-class-card">
                            <div class="card-header">
                                <h3 class="card-title">下一堂課</h3>
                            </div>
                            <div class="card-content">
                                <div class="next-class-info">
                                    <div class="class-time">
                                        <p class="time-label">時間</p>
                                        <p class="time-value" id="nextClassTime">--:-- ~ --:--</p>
                                    </div>
                                    <div class="class-location">
                                        <p class="location-label">教室</p>
                                        <p class="location-value" id="nextClassLocation">待確認</p>
                                    </div>
                                    <div class="class-name">
                                        <p class="name-label">課程</p>
                                        <p class="name-value" id="nextClassName">無課程</p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- 本月預算卡片 -->
                        <section class="card budget-card">
                            <div class="card-header">
                                <h3 class="card-title">本月預算</h3>
                            </div>
                            <div class="card-content">
                                <div class="budget-info">
                                    <div class="budget-bar">
                                        <div class="budget-used" id="budgetUsedBar"></div>
                                    </div>
                                    <div class="budget-stats">
                                        <div class="budget-stat">
                                            <p class="stat-label">已用</p>
                                            <p class="stat-value" id="budgetUsed">NT$ 0</p>
                                        </div>
                                        <div class="budget-stat">
                                            <p class="stat-label">剩餘</p>
                                            <p class="stat-value" id="budgetRemaining">NT$ 0</p>
                                        </div>
                                        <div class="budget-stat">
                                            <p class="stat-label">預算</p>
                                            <p class="stat-value" id="budgetTotal">NT$ 0</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- 本月數據卡片 -->
                        <section class="card monthly-data-card">
                            <div class="card-header">
                                <h3 class="card-title">本月數據</h3>
                            </div>
                            <div class="card-content">
                                <div class="monthly-stats">
                                    <div class="stat-item">
                                        <p class="stat-label">總支出</p>
                                        <p class="stat-value expense" id="totalExpense">NT$ 0</p>
                                    </div>
                                    <div class="stat-item">
                                        <p class="stat-label">總收入</p>
                                        <p class="stat-value income" id="totalIncome">NT$ 0</p>
                                    </div>
                                    <div class="stat-item">
                                        <p class="stat-label">結餘</p>
                                        <p class="stat-value balance" id="balance">NT$ 0</p>
                                    </div>
                                    <div class="stat-item">
                                        <p class="stat-label">筆數</p>
                                        <p class="stat-value count" id="recordCount">0</p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- 近七日花費柱狀圖 -->
                        <section class="card chart-card">
                            <div class="card-header">
                                <h3 class="card-title">近七日花費</h3>
                            </div>
                            <div class="card-content">
                                <div class="bar-chart" id="barChart">
                                    <div class="chart-placeholder">載入中...</div>
                                </div>
                            </div>
                        </section>

                        <!-- 今日課程列表 -->
                        <section class="card today-classes-card">
                            <div class="card-header">
                                <h3 class="card-title">今日課程</h3>
                            </div>
                            <div class="card-content">
                                <ul class="classes-list" id="todayClassesList">
                                    <li class="class-item">
                                        <span class="class-time">09:10 ~ 10:00</span>
                                        <span class="class-name">課程名稱</span>
                                        <span class="class-location">教室位置</span>
                                    </li>
                                </ul>
                            </div>
                        </section>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
