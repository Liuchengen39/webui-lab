<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>暨南大學｜課程排課系統</title>
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="layout">
    <!-- 左側導覽 -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-mark">△M</div>
        <div class="logo-text">
          <strong>暨南大學</strong>
          <span>課程排課系統</span>
        </div>
      </div>

      <nav class="nav">
        <a href="#" class="active"><span class="icon">▦</span><span class="label">綜合總覽</span></a>
        <a href="timetable.html"><span class="icon">▤</span><span class="label">課表</span></a>
        <a href="settings.html"><span class="icon">⚙</span><span class="label">系統設定</span></a>
      </nav>
    </aside>

    <!-- 右側主區 -->
    <main class="main">
      <header class="header">
        <div class="profile">
          <div class="avatar"></div>
          <div>
            <b>劉承恩</b>
            <small>大一</small>
          </div>
        </div>
      </header>

      <section class="content">
        <div class="title-row">
          <h1>綜合總覽</h1>
          <p>整體學分進度一覽，掌握畢業要求與修課狀況</p>
        </div>
        <div class="columns">
          <!-- 中間主內容 -->
          <div>
            <!-- 學分完成情況 -->
            <div class="card">
              <h2 class="card-title"><span class="ti">♟</span>學分完成情況</h2>
              <div class="credit-grid">
                <div class="credit-box">
                  <div class="credit-head">
                    <div class="circle-icon">
                      &lt;/&gt;
                    </div>
                    學分進度
                  </div>

                  <div class="credit-num">
                    <b id="creditTotalText">已修學分 0 / 128</b>
                    <span id="creditTotalPct">0%</span>
                  </div>
                  <div class="progress"><i id="creditTotalBar" style="width:0%"></i></div>
                  <div class="sub-title">必修 / 選修 / 領域課程 進度</div>
                  <div id="creditRows"></div>
                  <div class="warn-note" id="creditWarn"></div>
                </div>

                <div class="credit-box total">
                  <div class="credit-head">
                    <div class="circle-icon">◆</div>
                    總計
                  </div>
                  <div class="total-num" id="totalNum">已修學分<br>0 / 128</div>
                  <div class="ring" id="totalRing" data-pct="0%" style="--p:0"></div>
                  <small>※ 需符合目前的<br>畢業學分要求</small>
                </div>
              </div>
            </div>

            <!-- 本學期課程：四種來源共用一張表，用分頁籤切換 -->
            <div class="card table-card courses-card">
              <div class="card-head">
                <h2 class="card-title"><span class="ti">📘</span>本學期課程</h2>

                <div class="picker">
                  <span id="courseCount" class="picker-count">載入中…</span>
                  <select id="courseFilter"><option value="">全部</option></select>
                  <label class="search">
                    <span class="search-icon">🔍</span>
                    <input id="courseSearch" type="search" placeholder="搜尋課名、老師、課號" />
                  </label>
                  <button type="button" class="act-btn add" id="openManual">＋ 手動新增</button>
                </div>
              </div>

              <div class="tabs" id="courseTabs" role="tablist">
                <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="cs">資工系必選修<small id="tabCnt-cs"></small></button>
                <button type="button" class="tab" role="tab" aria-selected="false" data-tab="pe">體育<small id="tabCnt-pe"></small></button>
                <button type="button" class="tab" role="tab" aria-selected="false" data-tab="cm">全校共同必修<small id="tabCnt-cm"></small></button>
                <button type="button" class="tab" role="tab" aria-selected="false" data-tab="general">通識<small id="tabCnt-general"></small></button>
              </div>

              <table class="table" id="courseTable">
                <thead>
                  <tr>
                    <th>課程名稱</th>
                    <th>類別</th>
                    <th>學分</th>
                    <th>時間</th>
                    <th>老師</th>
                    <th>上課地點</th>
                    <th>狀態</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
              <div id="coursePager" class="pager"></div>
            </div>
          </div>

          <!-- 右側資訊欄（捲動時固定在畫面上） -->
          <div class="side">
            <!-- 課程分類進度 -->
            <div class="card right-card category">
              <h3>課程分類進度 <span style="font-size:12px;color:#7a8da8;">(目前選課後)</span></h3>

              <div id="catList"></div>
            </div>

            <!-- 已選課程（精簡版）：加課、退選當場就看得到 -->
            <div class="card right-card selected-card">
              <div class="side-head">
                <h3><span class="ti">▣</span>已選課程</h3>
                <span id="selectedSummary" class="picker-count"></span>
              </div>
              <div id="selectedList" class="sel-list"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <!-- 手動新增課程（加簽、外系課、資料裡沒有的課） -->
  <dialog id="manualDialog" class="manual-dialog">
    <div class="dlg-body">
      <h2 class="card-title"><span class="ti">✚</span>手動新增課程（加簽／補登）</h2>
      <form id="manualForm" class="manual-form" autocomplete="off">
        <label class="mf name">課程名稱 *
          <input id="mfName" type="text" maxlength="40" placeholder="例如：線性代數" required />
        </label>
        <label class="mf">學分 *
          <input id="mfCredits" type="number" min="0" max="9" step="0.5" value="3" required />
        </label>
        <label class="mf">類別 *
          <select id="mfCategory">
            <option>專業必修</option>
            <option>專業選修</option>
            <option>校共同必修</option>
            <option>通識-人文</option>
            <option>通識-社會</option>
            <option>通識-自然</option>
            <option>通識-特色</option>
            <option>自由學分</option>
          </select>
        </label>
        <label class="mf">上課時間
          <input id="mfTime" type="text" maxlength="30" placeholder="例如：2cd4d" />
        </label>
        <label class="mf">老師
          <input id="mfTeacher" type="text" maxlength="30" />
        </label>
        <label class="mf">地點
          <input id="mfLocation" type="text" maxlength="30" />
        </label>
        <div class="mf-actions">
          <button type="button" class="act-btn cancel" id="mfCancel">取消</button>
          <button type="submit" class="act-btn add">新增</button>
        </div>
      </form>
      <div class="mf-hint" id="mfMsg"></div>
    </div>
  </dialog>

  <script src="js/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
