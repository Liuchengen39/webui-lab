<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#214d7f">
    <title>系統設定｜暨南大學排課系統</title>
    <link rel="stylesheet" href="css/settings.css?v=3">
    <link rel="stylesheet" href="css/transitions.css?v=1">
    <script src="js/transitions.js?v=1" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/settings.js?v=4" defer></script>
  </head>
  <body>
    <header class="topbar">
      <button class="menu-toggle" type="button" aria-label="開啟導覽選單" aria-expanded="false" aria-controls="sidebar">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="index.html" aria-label="暨南大學排課系統首頁">
        <span class="brand-mark" aria-hidden="true">NCNU</span>
        <span class="brand-copy">
          <strong>暨南大學</strong>
          <small>排課系統</small>
        </span>
      </a>
      <div class="user-profile">
        <span class="avatar" aria-hidden="true">訪</span>
        <span>
          <strong>訪客</strong>
          <small>尚未登入</small>
        </span>
      </div>
    </header>

    <div class="app-shell">
      <div class="sidebar-backdrop" data-close-menu></div>
      <aside class="sidebar" id="sidebar" aria-label="主要導覽">
        <nav class="side-nav">
          <a class="nav-link" href="index.html">
            <span class="nav-dot" aria-hidden="true"></span>綜合總覽
          </a>
          <a class="nav-link" href="timetable.html">
            <span class="nav-dot" aria-hidden="true"></span>課表
          </a>
          <a class="nav-link is-active" href="settings.html" aria-current="page">
            <span class="nav-dot" aria-hidden="true"></span>系統設定
          </a>
        </nav>
        <p class="sidebar-note">暨南大學<br>學生排課與學分管理</p>
      </aside>

      <main class="main-content">
        <div class="page-heading">
          <div>
            <p class="eyebrow">學生學習管理</p>
            <h1>系統設定</h1>
          </div>
          <p class="page-description">管理 Google 帳號登入</p>
        </div>

        <section class="card content-card account-card" aria-labelledby="accountTitle">
          <div class="card-heading">
            <span class="heading-icon" aria-hidden="true"></span>
            <h2 id="accountTitle">Google 帳號登入</h2>
          </div>
          <p>登入後可在此瀏覽器工作階段辨識你的 Google 帳號。</p>
          <div id="googleSignIn"></div>
          <div class="account-session" id="accountSession" hidden>
            <strong id="accountName"></strong>
            <span id="accountEmail"></span>
          </div>
          <button class="account-signout" id="googleSignOut" type="button" hidden>登出</button>
          <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
        </section>

        <footer class="page-footer">暨南大學排課系統 <span>・</span> 學生學習管理</footer>
      </main>
    </div>
    <div class="app-toast" id="appToast" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
